name: Architecture Validation

on:
  push:
    branches:
      - main
      - product/noor-personal-mvp
  pull_request:
    branches:
      - main
      - product/noor-personal-mvp

jobs:
  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Run canonical architecture validation
        run: bash tools/ci/run-architecture-validation.sh
      - name: Build workspace
        run: npm run build

      - name: R323 browser visibility and interaction checks
        run: node tools/ci/noor-r323-visual-smoke.mjs
      - name: Upload R323 actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-r323-browser-evidence
          path: r323-visual-evidence/
          if-no-files-found: warn
