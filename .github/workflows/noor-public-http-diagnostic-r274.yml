name: NOOR public HTTP reachability diagnostic
on:
  push:
    branches:
      - diagnostic/noor-r274-public-http-check
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect external DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo 'DNS resolution from GitHub runner:'
          getent ahostsv4 noor-personal.onrender.com | head -n 3
          echo 'HTTP checks for production (no auth, no personal data):'
          failed=0
          for path in /healthz /readyz / /admin /noor-service-worker.js; do
            echo "CHECK_PATH=$path"
            curl --header 'Accept: text/html' --location --fail-with-body --retry 0 \
              --connect-timeout 6 --max-time 15 \
              --output /dev/null \
              --write-out 'HTTP=%{http_code} REMOTE_IP=%{remote_ip} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\\n' \
              "https://noor-personal.onrender.com$path"
            result=$?
            echo "CURL_STATUS=$result"
            if [[ "$result" -ne 0 ]]; then failed=1; fi
          done
          echo "VERIFY_R278_WORKER_RELEASE"
          curl --silent --show-error --fail --connect-timeout 6 --max-time 15 https://noor-personal.onrender.com/noor-service-worker.js | grep -q "NOOR R278" || failed=1
          exit "$failed"
